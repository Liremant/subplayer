[package]
name = "subplayer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
